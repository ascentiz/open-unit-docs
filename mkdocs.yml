site_name: BodyOS 开发者文档
site_url: https://ascentiz.github.io/open-unit-docs/
site_description: BodyOS 外骨骼系统中文开发者文档，包含 Exo Belt、B-core Pi 1、BodyOS SDK、API 与官方示例。
site_author: Ascentiz
repo_url: https://github.com/ascentiz/open-unit-docs
repo_name: ascentiz/open-unit-docs
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
exclude_docs: |
  api/index.md
  api/index.zh.md
  api/control-api.md
  api/control-api.zh.md
  api/telemetry-api.md
  api/telemetry-api.zh.md
  architecture/**
  tutorials/**
  research/**
  community/**
  getting-started/**
  examples/**
  hardware/**
  integrations/**
  mechanical/**
  sdk/**
  troubleshooting/**

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/ascentiz-logo.png
  favicon: assets/images/ascentiz-logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 中
          build: true
          site_name: BodyOS 开发者文档
        - locale: en
          name: EN
          build: true
          site_name: BodyOS Developer Documentation
          site_description: BodyOS exoskeleton developer documentation covering Exo Belt, B-core Pi 1, BodyOS SDK, APIs, and official examples.
          copyright: Copyright &copy; 2026 Ascentiz
          theme:
            language: en
          nav_translations:
            首页: Home
            产品与硬件: Product & Hardware
            系统组成与开发边界: System Components & Boundaries
            机械结构：Exo Belt: "Mechanical: Exo Belt"
            硬件：B-core Pi 1: "Hardware: B-core Pi 1"
            SDK 开发者手册: SDK Developer Guide
            API Reference: API Reference
            C++ API: C++ API
            Python API: Python API
            Integration Libraries（规划中）: Integration Libraries (Planned)
            官方示例: Official Examples

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ascentiz/open-unit-docs

nav:
  - 首页: index.md
  - 产品与硬件:
      - 系统组成与开发边界: product/overview.md
      - 机械结构：Exo Belt: product/exo-belt.md
      - 硬件：B-core Pi 1: product/b-core-pi-1.md
  - Installation: installation/index.md
  - BodyOS SDK:
      - SDK 开发者手册: api/README.md
      - API Reference:
          - C++ API: api/C++_API_Reference.md
          - Python API: api/Python_API_Reference.md
      - Integration Libraries（规划中）: api/integration-libraries.md
  - 官方示例: api/Examples_Guide.md

copyright: Copyright &copy; 2026 Ascentiz
