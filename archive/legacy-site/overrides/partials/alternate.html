{# Keep Material's language menu and i18n page-specific destinations. #}
<div class="md-header__option">
  <div class="md-select">
    <button type="button" class="md-header__button md-language-toggle" aria-label="{{ lang.t('select.language') }}" title="{{ lang.t('select.language') }}">
      中/EN
    </button>
    <div class="md-select__inner">
      <ul class="md-select__list">
        {% for alt in config.extra.alternate %}
          <li class="md-select__item">
            <a href="{{ alt.link | url }}" hreflang="{{ alt.lang }}" class="md-select__link">
              {{ alt.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
